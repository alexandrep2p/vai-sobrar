<div class="layout">
  @if (!isDesktop() && navOpen()) {
    <div class="backdrop" data-testid="nav-backdrop" (click)="navOpen.set(false)"></div>
  }

  <nav
    class="sidenav"
    [class.open]="navOpen()"
    [class.overlay]="!isDesktop()"
    [attr.inert]="navOpen() ? null : ''"
    aria-label="Navegação principal"
    data-testid="sidenav"
  >
    <a class="brand" routerLink="/home" (click)="onNavigate()">Vai Sobrar</a>
    @for (item of items; track item.path) {
      <a
        class="nav-link"
        data-testid="nav-link"
        [routerLink]="item.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="onNavigate()"
      >
        <tui-icon [icon]="item.icon" />
        <span>{{ item.label }}</span>
      </a>
    }
    @if (user(); as user) {
      <div class="account" data-testid="account">
        <span class="account-name">{{ user.name }}</span>
        <span class="account-username">&#64;{{ user.username }}</span>
      </div>
      <a
        class="nav-link"
        data-testid="account-link"
        routerLink="/conta"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="onNavigate()"
      >
        <tui-icon icon="@tui.circle-user" />
        <span>Minha conta</span>
      </a>
      <button class="nav-link" type="button" data-testid="logout" (click)="logout()">
        <tui-icon icon="@tui.log-out" />
        <span>Sair</span>
      </button>
    }
  </nav>

  <div class="main-column">
    <header class="topbar">
      @if (!isDesktop()) {
        <button
          tuiIconButton
          type="button"
          appearance="flat"
          iconStart="@tui.menu"
          (click)="navOpen.set(true)"
          data-testid="menu-toggle"
        >
          Abrir menu
        </button>
        <span class="topbar-title">Vai Sobrar</span>
      }
      <button
        tuiIconButton
        type="button"
        appearance="flat"
        class="theme-toggle"
        [iconStart]="dark() ? '@tui.sun' : '@tui.moon'"
        [attr.title]="themeLabel()"
        (click)="toggleTheme()"
        data-testid="theme-toggle"
      >
        {{ themeLabel() }}
      </button>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
