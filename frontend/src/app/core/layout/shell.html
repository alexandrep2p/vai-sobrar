<mat-sidenav-container class="container">
  <mat-sidenav
    class="sidenav"
    [mode]="isDesktop() ? 'side' : 'over'"
    [opened]="navOpen()"
    (closedStart)="navOpen.set(false)"
    [attr.aria-label]="'Navegação principal'"
  >
    <a class="brand" routerLink="/home" (click)="onNavigate()">Vai Sobrar</a>
    <mat-nav-list>
      @for (item of items; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #active="routerLinkActive"
          [activated]="active.isActive"
          (click)="onNavigate()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
    @if (user(); as user) {
      <mat-divider />
      <div class="account" data-testid="account">
        <span class="account-name">{{ user.name }}</span>
        <span class="account-username">&#64;{{ user.username }}</span>
      </div>
      <mat-nav-list>
        <a
          mat-list-item
          routerLink="/conta"
          routerLinkActive
          #account="routerLinkActive"
          [activated]="account.isActive"
          (click)="onNavigate()"
        >
          <mat-icon matListItemIcon>account_circle</mat-icon>
          <span matListItemTitle>Minha conta</span>
        </a>
      </mat-nav-list>
      <mat-action-list>
        <button mat-list-item type="button" (click)="logout()" data-testid="logout">
          <mat-icon matListItemIcon>logout</mat-icon>
          <span matListItemTitle>Sair</span>
        </button>
      </mat-action-list>
    }
  </mat-sidenav>

  <mat-sidenav-content>
    @if (!isDesktop()) {
      <mat-toolbar class="topbar">
        <button mat-icon-button aria-label="Abrir menu" (click)="navOpen.set(true)">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="topbar-title">Vai Sobrar</span>
      </mat-toolbar>
    }
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
