<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Vai Sobrar</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
    <script>
      // Aplica o tema (PD-40) antes de o Angular iniciar, evitando piscar claro no modo escuro.
      // A chave é a padrão do Taiga (TUI_DARK_MODE_KEY); sem escolha salva, segue o sistema.
      try {
        const saved = localStorage.getItem('tuiDark');
        const dark = saved ? saved === 'true' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.body.setAttribute('tuiTheme', 'dark');
      } catch {}
    </script>
  </body>
</html>
